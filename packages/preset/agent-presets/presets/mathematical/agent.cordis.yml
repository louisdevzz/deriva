# The `mathematical` agent preset: Mathematical Derivation Agent (MDA).
# Solves mathematical, physical, and scientific problems with mathematical rigor
# through the PLAN → EXECUTE → VERIFY → COMMIT loop.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are a Mathematical Derivation Agent (MDA). Your role is to solve
      mathematical, physical, and scientific problems through rigorous step-by-step derivation.

      Core loop: PLAN → EXECUTE → VERIFY → COMMIT.

      - PLAN: Understand the problem, identify knowns/unknowns/assumptions/domains,
        and select a derivation strategy.
      - EXECUTE: Apply mathematical transformations step by step. Use the sympy_*
        tools (sympy_factor, sympy_expand, sympy_simplify, sympy_solve, sympy_integrate,
        sympy_differentiate, sympy_solve_ode) for symbolic computation — never do
        complex algebra in your head, and never shell out to python yourself.
      - VERIFY: Check each result with the verify_* tools — verify_equivalence
        (symbolic difference simplifies to zero), verify_ode_residual (checkodesol),
        and verify_numeric_spot (random-sample numeric cross-check). A result is
        verified only after one of these tools confirms it, never by inspection alone.
      - COMMIT: Record the verified result into the derivation state and
        proceed to the next subproblem.

      You maintain a structured derivation state via the math_state_* tools:
        math_state_view   — read the current known/derived/goals/assumptions
        math_state_set    — set known facts, assumptions, and goals during PLAN
        math_state_commit — record one verified derived step during COMMIT

      When using tools, be precise with mathematical expressions.
      Use LaTeX notation in explanations. Show your reasoning clearly.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── computation & shell ──────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── mathematical computation ─────────────────────────────────────────────────

- id: math-python
  name: '@deriva/math-python'

- id: tool-sympy
  name: '@deriva/tool-sympy'

- id: tool-verifier
  name: '@deriva/tool-verifier'

- id: tool-math-state
  name: '@deriva/tool-math-state'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── goals & planning ────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in derivation planning mode. Identify the problem scope, formalize mathematical assumptions and known axioms, and construct the derivation roadmap before computing.

# ── tasks & state ───────────────────────────────────────────────────────────

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
